# Free Supabase projects pause after about a week of low activity and need a
# manual resume. This makes one small request from outside every three days
# (a free tier trade-off). Render is left to sleep: the installed app opens
# from its service-worker cache.
#
# It uses the publishable key, which is public by design (it ships in the web
# app). Row level security refuses the read, which is fine: it still reaches
# the database. Without the repository secrets (for example in a fork) it
# skips instead of failing.
name: Keep Supabase awake

on:
  schedule:
    - cron: "23 6 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query the database through Supabase's API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::notice::SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository secrets are not set; skipping."
            exit 0
          fi
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/sessions?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          echo "Supabase answered $status"
          # 200 (empty, RLS) or 401/403 all mean the database was reached; 5xx means it wasn't.
          case "$status" in
            2??|401|403) exit 0 ;;
            *) exit 1 ;;
          esac
