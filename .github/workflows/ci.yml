name: CI

on:
  pull_request:
  push:
    branches: [main]

# One job on purpose: a free private repo gets 2,000 Actions minutes a month,
# and every job bills at least a minute. Later tasks add their steps here.
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Migrations and RLS are tested against a real Postgres, with a small
    # Supabase stub (supabase/tests/supabase-stub.sql).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:db
      - run: npm run build
      - name: Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # Installable, service worker in control, opens offline (plan D8).
      - run: npm run e2e
      # Accessibility score at least 0.95 on every listed page.
      - run: npm run lighthouse
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            test-results/
            .lighthouseci/
