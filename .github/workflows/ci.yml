name: CI

on:
  pull_request:
  push:
    branches: [main]

# One job on purpose: every job bills at least a minute (private repos get a
# limited monthly allowance), so all the checks run as steps in a single job.
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Migrations and RLS are tested against a real Postgres, with a small
    # Supabase stub (supabase/tests/supabase-stub.sql).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # CI builds point at a Supabase that e2e/fixtures.ts answers; nothing real is called.
      VITE_SUPABASE_URL: http://localhost:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:db
      - run: npm run build
      - name: Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Chromium (Android) and WebKit (Safari's engine, the iPhone project).
      - run: npx playwright install --with-deps chromium webkit
      # Installable, service worker in control, opens offline (plan D8).
      - run: npm run e2e
      # Accessibility score at least 0.95 on every listed page.
      - run: npm run lighthouse
      # A new version reaches an already-open app (issue #38). Rebuilds dist, so it runs last.
      - run: npm run check:update
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            test-results/
            .lighthouseci/
