name: CI

on:
  pull_request:
  push:
    branches: [main]

# One job on purpose: a free private repo gets 2,000 Actions minutes a month,
# and every job bills at least a minute. Later tasks add their steps here.
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      # Installable, service worker in control, opens offline (plan D8).
      - run: npm run e2e
      # Accessibility score at least 0.95 on every listed page.
      - run: npm run lighthouse
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            test-results/
            .lighthouseci/
